[package]
name = "space-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
space-preview.workspace = true
space-proto.workspace = true
space-doc.workspace = true
space-sync.workspace = true
space-harness.workspace = true
semver = "1"
space-rpc.workspace = true
space-update.workspace = true
space-notify.workspace = true
space-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
space-term-link.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Cloud runner identity: Ed25519 device key (already in the tree via rustls).
ring = "0.17"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via space-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
space-mcp.workspace = true
space-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
